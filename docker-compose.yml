services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: aml
      POSTGRES_DB: aml
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml"]
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      PG_DSN: postgresql://aml:aml@db:5432/aml
      PG_AGENT_DSN: postgresql://aml_agent:aml_agent@db:5432/aml
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  ui:
    build: .
    command: ["streamlit", "run", "aml/ui.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  pgdata:
